components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        code:
          type: string
          maxLength: 8
      required:
      - code
      - id
      - name
    ComplaintSerializerRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        complaint_type:
          allOf:
          - $ref: '#/components/schemas/Nested'
          readOnly: true
        description:
          type: string
          nullable: true
        city:
          allOf:
          - $ref: '#/components/schemas/Nested'
          readOnly: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        road_type:
          allOf:
          - $ref: '#/components/schemas/Nested'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        photo_base64:
          type: string
        votes:
          type: object
          properties:
            Y:
              type: integer
            N:
              type: integer
          required:
          - N
          - Y
          readOnly: true
      required:
      - city
      - complaint_type
      - created_at
      - id
      - latitude
      - longitude
      - road_type
      - votes
    ComplaintSerializerWrite:
      type: object
      properties:
        complaint_type:
          type: integer
        description:
          type: string
          nullable: true
        city:
          type: integer
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        road_type:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        photo_base64:
          type: string
      required:
      - city
      - complaint_type
      - created_at
      - latitude
      - longitude
    ComplaintType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        code:
          type: string
          maxLength: 8
      required:
      - code
      - id
      - name
    ComplaintVote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        vote_type:
          $ref: '#/components/schemas/VoteTypeEnum'
      required:
      - id
      - vote_type
    Nested:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        code:
          type: string
          maxLength: 8
        color:
          type: string
          maxLength: 18
      required:
      - code
      - color
      - id
      - name
    PatchedComplaintSerializerRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        complaint_type:
          allOf:
          - $ref: '#/components/schemas/Nested'
          readOnly: true
        description:
          type: string
          nullable: true
        city:
          allOf:
          - $ref: '#/components/schemas/Nested'
          readOnly: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        road_type:
          allOf:
          - $ref: '#/components/schemas/Nested'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        photo_base64:
          type: string
        votes:
          type: object
          properties:
            Y:
              type: integer
            N:
              type: integer
          required:
          - N
          - Y
          readOnly: true
    PatchedComplaintVote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        vote_type:
          $ref: '#/components/schemas/VoteTypeEnum'
    VoteTypeEnum:
      enum:
      - Y
      - N
      type: string
      description: |-
        * `Y` - Yes
        * `N` - No
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
