upstream cipe {
  server app:8000;
}

server {
    listen 80;
    server_name ec2-52-70-141-117.compute-1.amazonaws.com;

    location / {
        proxy_pass http://cipe;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location /static/ {
        alias /home/app/web/static/;
    }
    location /media/ {
        alias /home/app/web/media/;
    }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name ec2-52-70-141-117.compute-1.amazonaws.com;

    ssl_certificate /etc/letsencrypt/live/ec2-52-70-141-117.compute-1.amazonaws.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ec2-52-70-141-117.compute-1.amazonaws.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://cipe;
    }
}