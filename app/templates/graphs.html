{% extends 'base.html' %}
{% load static %}

{% block content %}
{{ stats|json_script:'stats' }}

<div class="toast" style="position: fixed; top: 20px; right: 20px">
  <div class="toast-header">
    <strong class="mr-auto text-primary">Aviso</strong>
    <button type="button" class="ml-2 mb-1 close" data-dismiss="toast">
      &times;
    </button>
  </div>
  <div class="toast-body">
    No existen registros que correspondan con los filtros seleccionados
  </div>
</div>
<div class="container">
  <div class="row align-items-center mb-3 mt-3 justify-content-center">
    <form class="row align-items-end" method="POST" id="filter">
      {% csrf_token %}
      <div class="col">
        <label class="my-1 mr-2" for="scientific_area">Ciudad</label>
        <select class="form-select my-1 mr-sm-2" id="scientific_area">
          <option selected value="">Todas</option>
          {% for city in cities %}
            <option value="{{ city.id }}">{{ city.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col">
        <label class="my-1 mr-2" for="position">Tipo denuncia</label>
        <select class="form-select my-1 mr-sm-2" id="position">
          <option value="" selected>Todas</option>
          {% for complaint_type in complaint_types %}
            <option value="{{ complaint_type.id }}">
              {{ complaint_type.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col">
        <div class="custom-control custom-checkbox" style="display: none">
          <input type="checkbox" class="custom-control-input" id="becal" />
          <label class="custom-control-label mr-3" for="becal">Becal</label>
        </div>
        <button type="submit" class="btn btn-primary my-1">Filtrar</button>
      </div>
    </form>
  </div>
</div>

<div class="container-fluid">
  <p class="fw-bold fs-3 text-center">Denuncias por ciudadades</p>
  <div id="main" class="w-auto" style="height: 400px"></div>

  <div class="d-flex justify-content-center mb-4 gap-4">
    <button class="btn btn-primary">
      <a href="{% url 'complaints-per-city-csv-report' %}" download>
        <img src="{% static 'app/img/icons/file-earmark-arrow-down.svg' %}" />
        Descargar CSV
      </a>
    </button>
    <button class="btn btn-primary">
      <a href="{% url 'complaints-per-city-json-report' %}" target="_blank">
        <img src="{% static 'app/img/icons/file-earmark-arrow-down.svg' %}" />
        Descargar JSON
      </a>
    </button>
  </div>

  <p class="fw-bold fs-3 text-center">Denuncias por tipo de denuncia</p>
  <div id="main2" class="w-auto" style="height: 400px"></div>

  <div class="d-flex justify-content-center mb-4 gap-4">
    <button class="btn btn-primary">
      <a href="{% url 'complaints-per-complaint-type-csv-report' %}" download>
        <img src="{% static 'app/img/icons/file-earmark-arrow-down.svg' %}" />
        Descargar CSV
      </a>
    </button>
    <button class="btn btn-primary">
      <a href="{% url 'complaints-per-complaint-type-json-report' %}" target="_blank">
        <img src="{% static 'app/img/icons/file-earmark-arrow-down.svg' %}" />
        Descargar JSON
      </a>
    </button>
  </div>
</div>
{% endblock %}

<script>
{% block javascript %}
  const stats = JSON.parse(document.querySelector('#stats').textContent);

  const mainDiv = document.querySelector('#main');
  const complaints_per_city_graph = echarts.init(mainDiv);
  const complaints_per_city_graph_options = {
    tooltip: {},
    legend: {
      data: stats.complaints_per_city.map((complaint) => complaint.city)
    },
    xAxis: {
      data: stats.complaints_per_city.map((complaint) => complaint.city)
    },
    yAxis: {},
    series: [{ type: 'bar' }],
    dataset: {
      source: stats.complaints_per_city.map((complaint) => [complaint.city, complaint.count])
    }
  };
  complaints_per_city_graph.setOption(complaints_per_city_graph_options);

  const mainDiv2 = document.querySelector('#main2');
  const complaints_per_complaint_type = echarts.init(mainDiv2);
  const complaints_per_complaint_type_options = {
    tooltip: {},
    legend: {
      data: stats.complaints_per_complaint_type.map((complaint) => complaint.complaint_type)
    },
    xAxis: {
      data: stats.complaints_per_complaint_type.map((complaint) => complaint.complaint_type)
    },
    yAxis: {},
    series: [{ type: 'bar' }],
    dataset: {
      source: stats.complaints_per_complaint_type.map((complaint) => [complaint.complaint_type, complaint.count])
    }
  };
  complaints_per_complaint_type.setOption(complaints_per_complaint_type_options);
{% endblock %}
</script>
