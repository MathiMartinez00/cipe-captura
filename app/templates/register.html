{% extends 'base.html' %}

<script>
{% block javascript %}
    // Google Maps Map instance
    const { map, markerClusterer } = await initMap('map-registration', true);
    const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary(
        "marker",
    );

    function placeMarkerAndPanTo(latLng, map) {
        removeMarkers(markerClusterer);
        const newMarker = new google.maps.marker.AdvancedMarkerElement({
            position: latLng,
            map: map,
        });
        markerClusterer.addMarker(newMarker);
        $('#id_location_lat').val(latLng.lat);
        $('#id_location_lng').val(latLng.lng);
        map.panTo(latLng);
        map.setZoom(18);
    }
    
    map.addListener("click", (e) => {
        placeMarkerAndPanTo(e.latLng, map);
    });
    
    const regResult = parseInt("{{ registration_result }}");
    const msg = "{{ msg }}";
    const is_edit_form = parseInt("{{ edit }}");
    if (is_edit_form == 1) {
        document.getElementById("form_title").innerHTML = 'Editar Registro de Investigador';
        const institution = {{ institution|safe }};
        if ('latitude' in institution && 'longitude' in institution && 'name' in institution) {
            addMarker(map, institution['latitude'], institution['longitude'], institution['name']);
        }
    }
    if (regResult >= 0) {
        document.getElementById("msgReg").innerHTML = msg;
        if (regResult === 1) {
            alertClassName = "alert-danger";
        }
        if (regResult === 0) {
            alertClassName = "alert-success";
        }
        element = document.getElementById("myAlert");
        arr = element.className.split(" ");
        if (arr.indexOf(alertClassName) === -1) {
            element.className += " " + alertClassName;
        }
        $("#myAlert").show();
        window.setTimeout(function() {
            $("#myAlert").fadeTo(300, 0).slideUp(500, function() {
                $(this).remove();
            });
        }, 4000);
    }
{% endblock %}
</script>

{% block content %}
    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-8 mt-5 mx-auto">
                <h2 id='form_title' class="text-center text-uppercase text-secondary mt-5">Crear denuncia</h2>
                <div class="divider-custom">
                    <div class="divider-custom-line"></div>
                </div>
                <form method="POST" onkeydown="return event.key != 'Enter';" enctype="multipart/form-data"> 
                    {% csrf_token %}
                    <div class="control-group">
                        <div class="form-group floating-label-form-group controls mb-0 pb-2">
                            {{ form.as_p }}
                            <p style="font-size:1.5em;color:#6c757d;">Ubicación * (seleccione en el mapa)</p>
                            <div id="map-registration"></div>
                        </div>
                    </div>
                    <div>
                        <span class="badge text-bg-secondary">* Campo Requerido</span>
                    </div>
                    <div class="my-4 form-group d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary btn-xl" id="submitButton">Denunciar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script defer src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}"></script>
{% endblock %}
